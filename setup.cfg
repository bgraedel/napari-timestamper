[metadata]
name = napari-timestamper

description = Timestamps, Fiji-style time bars and layer-name labels for napari, with image and movie export
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/bgraedel/napari-timestamper
author = Benjamin Grädel
author_email = benjamin.graedel@unibe.ch
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Framework :: napari
    Intended Audience :: Science/Research
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Scientific/Engineering :: Image Processing
    Topic :: Scientific/Engineering :: Visualization
keywords = napari, timestamp, time bar, timelapse, annotation, movie export, overlay
project_urls =
    Bug Tracker = https://github.com/bgraedel/napari-timestamper/issues
    Documentation = https://github.com/bgraedel/napari-timestamper#README.md
    Source Code = https://github.com/bgraedel/napari-timestamper
    User Support = https://github.com/bgraedel/napari-timestamper/issues

[options]
packages = find:
# napari itself is not a hard dependency (napari plugin convention);
# napari >= 0.10 is required at runtime.
install_requires =
    av  # mp4 (H.264) export via imageio
    imageio
    numpy
    pint
    qtpy
    superqt
    vispy

python_requires = >=3.11
include_package_data = True
package_dir =
    =src
setup_requires = setuptools_scm

[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    napari-timestamper = napari_timestamper:napari.yaml

[options.extras_require]
all =
    napari[all] >= 0.10
testing =
    tox
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-qt  # https://pytest-qt.readthedocs.io/en/latest/
    napari[pyqt6] >= 0.10


[options.package_data]
* = *.yaml
